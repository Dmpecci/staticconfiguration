[project]
name = "staticconfiguration"
version = "0.1.0"
description = "Herramienta para crear configuraciones globales, instancias estáticas"
authors = [
    { name = "David Muñoz Pecci" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=7.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-m 'not slow and not stress'"
markers = [
    "stress: marks tests as stress/performance tests (deselect with '-m \"not stress\"')",
    "slow: marks tests that are slow to run (deselect with '-m \"not slow\"')"
]