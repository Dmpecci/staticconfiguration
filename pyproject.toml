[project]
name = "staticconfiguration"
version = "1.0.0"
description = "Strongly-typed, persistent global configuration for DI edge cases in single-machine applications."
authors = [
    { name = "David Muñoz Pecci", email = "davidmpe2002@gmail.com" }
]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=7.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["staticconfiguration*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
addopts = "-m not slow and not stress"
markers = [
    "stress: marks tests as stress/performance tests (deselect with '-m \"not stress\"')",
    "slow: marks tests that are slow to run (deselect with '-m \"not slow\"')"
]